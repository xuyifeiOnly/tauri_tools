name: build

# 在原生 Windows / macOS runner 上构建安装包。
# Windows 无法从 macOS 交叉编译（ring 等 C 依赖需要 MSVC 工具链），必须用 windows-latest。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: bun install

      - name: Build Windows installer (NSIS)
        # beforeBuildCommand 会自动执行 bun run build。
        run: bunx tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: suixiang-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: bun install

      - name: Build macOS app
        run: bunx tauri build --bundles app

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: suixiang-macos
          path: src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error
