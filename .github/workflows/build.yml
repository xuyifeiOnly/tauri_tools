name: build

# 在原生 Windows / macOS runner 上构建安装包，并统一发布到 GitHub Release。
# Windows 无法从 macOS 交叉编译（ring 等 C 依赖需要 MSVC 工具链），必须用 windows-latest。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# 默认只读；仅 release job 提升为 contents: write。
permissions:
  contents: read

jobs:
  prepare:
    # 构建前校验三处版本一致，并派生 Release 标签与固定 commit。
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve release metadata
        id: meta
        run: bun scripts/release-metadata.ts

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            bundle: app
            artifact: suixiang-macos
          - platform: windows-latest
            bundle: nsis
            artifact: suixiang-windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 固定到 prepare 解析出的本轮源码 commit，避免漂移到默认分支。
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: bun install

      - name: Build installer
        # beforeBuildCommand 会自动执行 bun run build。
        run: bunx tauri build --bundles ${{ matrix.bundle }}

      - name: Package macOS app
        if: matrix.platform == 'macos-latest'
        run: |
          cd src-tauri/target/release/bundle/macos
          # ditto 保留 .app 的符号链接与可执行权限。
          ditto -c -k --sequesterRsrc --keepParent "随享.app" "随享-macos.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/macos/*.zip
          if-no-files-found: error

  release:
    # 两个平台都成功后才发布；手动触发同样按源码版本创建/更新 Release。
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify artifacts
        run: |
          if [ -z "$(find artifacts -type f -print -quit)" ]; then
            echo "没有可发布的安装包，已中止" >&2
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
