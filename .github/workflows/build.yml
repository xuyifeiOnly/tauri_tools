name: build

# 在原生 Windows / macOS runner 上构建安装包，并统一发布到 GitHub Release。
# Windows 无法从 macOS 交叉编译（ring 等 C 依赖需要 MSVC 工具链），必须用 windows-latest。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# 默认只读；仅 release job 提升为 contents: write。
permissions:
  contents: read

jobs:
  prepare:
    # 构建前校验三处版本一致，并派生 Release 标签与固定 commit。
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve release metadata
        id: meta
        run: bun scripts/release-metadata.ts

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            bundle: app
            artifact: suixiang-macos
          - platform: windows-latest
            bundle: nsis
            artifact: suixiang-windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 固定到 prepare 解析出的本轮源码 commit，避免漂移到默认分支。
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: bun install

      - name: Build installer
        # beforeBuildCommand 会自动执行 bun run build。
        run: bunx tauri build --bundles ${{ matrix.bundle }}

      - name: Test Windows background processes
        if: matrix.platform == 'windows-latest'
        run: cargo test --manifest-path src-tauri/Cargo.toml platform::windows_process_tests

      - name: Package macOS app
        if: matrix.platform == 'macos-latest'
        run: |
          cd src-tauri/target/release/bundle/macos
          # ditto 保留 .app 的符号链接与可执行权限。
          ditto -c -k --sequesterRsrc --keepParent "随享.app" "随享-macos.zip"

      - name: Package Windows installer as ZIP
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)"
          }
          $installer = $installers[0]
          $archive = Join-Path $installer.DirectoryName "suixiang_$($env:RELEASE_VERSION)_windows_x64.zip"
          Compress-Archive -LiteralPath $installer.FullName -DestinationPath $archive
          # 解压回读并校验哈希，避免上传缺失或内容变化的安装程序。
          $checkDir = Join-Path $env:RUNNER_TEMP "installer-zip-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          Expand-Archive -LiteralPath $archive -DestinationPath $checkDir
          $extracted = @(Get-ChildItem $checkDir -File -Recurse)
          if ($extracted.Count -ne 1 -or $extracted[0].Name -ne $installer.Name) {
            throw 'ZIP must contain exactly the original installer'
          }
          if ((Get-FileHash $installer.FullName).Hash -ne (Get-FileHash $extracted[0].FullName).Hash) {
            throw 'Installer ZIP integrity check failed'
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/nsis/*.zip
            src-tauri/target/release/bundle/macos/*.zip
          if-no-files-found: error

  release:
    # 两个平台都成功后才发布；手动触发同样按源码版本创建/更新 Release。
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify artifacts
        run: |
          test -n "$(find artifacts/suixiang-windows -type f -name '*.zip' -print -quit)"
          test -n "$(find artifacts/suixiang-macos -type f -name '*.zip' -print -quit)"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          files: artifacts/**/*.zip
          fail_on_unmatched_files: true
